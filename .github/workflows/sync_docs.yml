name: Manual Sync Docs Folder

on:
  workflow_dispatch:  # ✅ Manual trigger

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout northern-ireland-greenhouse-gas-inventory repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true  # ✅ Keeps authentication for pushing

      - name: Clone GHGI_24_Dashboard repository
        run: |
          git clone https://github.com/DAERA-Climate-Stats/GHGI_24_Dashboard.git source_repo
          
      - name: Copy root directory contents
        run: |
          cp -r source_repo/* .
          cp -r source_repo/.[^.]* . 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Sync from GHGI_24_Dashboard"
          git push origin main  # ✅ Push changes to northern-ireland-greenhouse-gas-inventory
