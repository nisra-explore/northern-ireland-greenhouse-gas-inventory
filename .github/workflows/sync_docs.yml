name: Manual Sync Docs Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Clone source repository
        run: |
          git clone --depth 1 https://github.com/DAERA-Climate-Stats/GHGI_24_Dashboard.git source_repo
          rm -rf source_repo/.git

      - name: Copy source contents
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='source_repo' \
            source_repo/ ./

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf source_repo

          git add -A
          git diff --cached --quiet || git commit -m "Sync from GHGI_24_Dashboard"
          git push origin main
